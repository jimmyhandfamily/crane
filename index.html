<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crane — Training Yard</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #a8d4e8;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #renderCanvas {
        width: 100%; height: 100%; display: block;
        outline: none; touch-action: none;
      }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #hud .panel { pointer-events: auto; }

      /* Top-left stack: rank + slim objective under it — never covers work area */
      #hud-title {
        position: absolute; top: 12px; left: 12px;
        background: rgba(255, 255, 255, 0.62);
        backdrop-filter: blur(6px);
        border-radius: 8px;
        padding: 8px 12px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.45);
        max-width: min(260px, 42vw);
      }
      #hud-title h1 {
        font-size: 0.88rem; font-weight: 650; color: #2c3a45;
        letter-spacing: 0.01em;
      }
      #hud-title .role {
        font-size: 0.65rem; color: #5a6a75; margin-top: 1px;
        text-transform: uppercase; letter-spacing: 0.06em;
      }

      #hud-objective {
        position: absolute; top: 62px; left: 12px;
        background: rgba(255, 255, 255, 0.48);
        backdrop-filter: blur(5px);
        border-radius: 8px;
        padding: 6px 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.35);
        max-width: min(280px, 44vw);
        text-align: left;
        pointer-events: none;
      }
      #hud-objective .label {
        font-size: 0.58rem; text-transform: uppercase;
        letter-spacing: 0.07em; color: #7ba05b; font-weight: 600;
        margin-bottom: 2px;
      }
      #hud-objective .text {
        font-size: 0.72rem; color: #2c3a45; line-height: 1.3;
        opacity: 0.9;
      }

      #hud-pay {
        position: absolute; top: 12px; right: 12px;
        background: rgba(232, 184, 74, 0.72);
        border-radius: 8px;
        padding: 6px 10px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
        font-size: 0.7rem; color: #3a3018; font-weight: 600;
        opacity: 0.85; max-width: 140px;
      }
      #hud-pay .stub {
        font-size: 0.58rem; font-weight: 500; opacity: 0.75; margin-top: 1px;
      }

      #hud-hint {
        position: absolute; bottom: 16px; left: 12px;
        font-size: 0.68rem; color: rgba(44, 58, 69, 0.5);
        background: rgba(255, 255, 255, 0.4);
        padding: 4px 8px; border-radius: 6px;
        max-width: min(360px, 50vw);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        pointer-events: none;
      }

      #crane-pad {
        position: absolute; right: 12px; bottom: 16px;
        z-index: 30;
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 44px) auto;
        gap: 5px;
        pointer-events: auto; user-select: none;
        -webkit-user-select: none; touch-action: none;
      }
      #crane-pad .pad-btn {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(6px);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
        color: #2c3a45; font-size: 0.65rem; font-weight: 650;
        cursor: pointer; line-height: 1.1; padding: 3px;
      }
      #crane-pad .pad-btn .key {
        font-size: 0.58rem; font-weight: 600; color: #5a6a75;
        letter-spacing: 0.04em;
      }
      #crane-pad .pad-btn.active {
        background: rgba(232, 184, 74, 0.92);
        color: #3a3018; transform: scale(0.96);
      }
      #crane-pad .pad-btn.active .key { color: #5a4820; }
      #crane-pad .btn-raise { grid-column: 1; grid-row: 1; }
      #crane-pad .btn-out   { grid-column: 2; grid-row: 1; }
      #crane-pad .btn-right { grid-column: 3; grid-row: 1; }
      #crane-pad .btn-lower { grid-column: 1; grid-row: 2; }
      #crane-pad .btn-in    { grid-column: 2; grid-row: 2; }
      #crane-pad .btn-left  { grid-column: 3; grid-row: 2; }
      #crane-pad .btn-grab {
        grid-column: 1 / -1; grid-row: 3; min-height: 40px;
        flex-direction: row; gap: 6px;
        background: rgba(82, 92, 102, 0.88); color: #fff;
      }
      #crane-pad .btn-grab .key { color: rgba(255, 255, 255, 0.85); }
      #crane-pad .btn-grab.holding {
        background: rgba(232, 184, 74, 0.92); color: #3a3018;
      }
      #crane-pad .btn-grab.holding .key { color: #5a4820; }
      #crane-pad .btn-grab.active { background: rgba(82, 92, 102, 1); }
      #crane-pad .pad-label {
        grid-column: 1 / -1; grid-row: 4;
        font-size: 0.58rem; color: rgba(44, 58, 69, 0.5);
        text-align: center; align-self: center; pointer-events: none;
      }

      /* Compact load meter — top center, slim */
      #hud-load {
        position: absolute; top: 12px; left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.58);
        backdrop-filter: blur(6px);
        border-radius: 8px;
        padding: 6px 12px 8px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.45);
        min-width: 150px; max-width: 200px;
        pointer-events: none;
      }
      #hud-load .load-head {
        display: flex; justify-content: space-between;
        align-items: baseline; gap: 8px; margin-bottom: 4px;
      }
      #hud-load .load-title {
        font-size: 0.58rem; text-transform: uppercase;
        letter-spacing: 0.07em; color: #5a6a75; font-weight: 650;
      }
      #hud-load .load-label {
        font-size: 0.68rem; font-weight: 700; color: #2c3a45;
      }
      #hud-load .load-value {
        font-size: 0.62rem; color: #5a6a75;
        font-variant-numeric: tabular-nums;
      }
      #hud-load .load-bar {
        height: 6px; border-radius: 999px;
        background: rgba(44, 58, 69, 0.1); overflow: hidden;
      }
      #hud-load .load-fill {
        height: 100%; width: 0%; border-radius: 999px;
        background: #8aa0b0;
        transition: width 0.18s ease, background 0.18s ease;
      }
      #hud-load[data-band="empty"] .load-fill { background: #8aa0b0; }
      #hud-load[data-band="light"] .load-fill { background: #7ba05b; }
      #hud-load[data-band="heavy"] .load-fill { background: #e8b84a; }
      #hud-load[data-band="heavy"] .load-label { color: #8a6a18; }
      #hud-load[data-band="swing"] .load-fill { background: #e07a3d; }
      #hud-load[data-band="swing"] .load-label { color: #b04a18; }
      #hud-load[data-band="swing"] {
        border-color: rgba(224, 122, 61, 0.55);
        background: rgba(255, 236, 220, 0.72);
      }

      @media (max-width: 640px) {
        #hud-load {
          top: auto; bottom: 280px; left: 10px; transform: none;
          min-width: 120px;
        }
        #hud-objective { max-width: 55vw; }
        #crane-pad {
          grid-template-columns: repeat(3, 46px);
          grid-template-rows: repeat(3, 40px) auto;
          right: 8px; bottom: 12px;
        }
        #hud-hint { bottom: 200px; font-size: 0.6rem; max-width: 48vw; }
        #hud-load { bottom: 210px; }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud">
      <div id="hud-title" class="panel">
        <h1>Training Yard</h1>
        <div class="role">Apprentice</div>
      </div>
      <div id="hud-objective" class="panel">
        <div class="label">Objective</div>
        <div class="text">Pick up a crate and place it on Pad A</div>
      </div>
      <div id="hud-load" class="panel" data-band="empty" aria-label="Hook load">
        <div class="load-head">
          <span class="load-title">Hook load</span>
          <span class="load-label">Empty</span>
          <span class="load-value">0 kg</span>
        </div>
        <div class="load-bar"><div class="load-fill"></div></div>
      </div>
      <div id="hud-pay" class="panel">
        Day rate: $0
        <div class="stub">Pay unlocks later — stub</div>
      </div>
      <div id="hud-hint">A/D slew · W/S trolley · R/F hoist · Space grab/release · Drag orbit · Scroll zoom</div>
      <div id="crane-pad" class="panel" aria-label="Crane controls">
        <button type="button" class="pad-btn btn-raise" data-axis="hoist" data-dir="1" title="Raise hook (R)">
          Raise<span class="key">R</span>
        </button>
        <button type="button" class="pad-btn btn-out" data-axis="trolley" data-dir="1" title="Trolley out (W)">
          Out<span class="key">W</span>
        </button>
        <button type="button" class="pad-btn btn-right" data-axis="slew" data-dir="1" title="Slew right (D)">
          Right<span class="key">D</span>
        </button>
        <button type="button" class="pad-btn btn-lower" data-axis="hoist" data-dir="-1" title="Lower hook (F)">
          Lower<span class="key">F</span>
        </button>
        <button type="button" class="pad-btn btn-in" data-axis="trolley" data-dir="-1" title="Trolley in (S)">
          In<span class="key">S</span>
        </button>
        <button type="button" class="pad-btn btn-left" data-axis="slew" data-dir="-1" title="Slew left (A)">
          Left<span class="key">A</span>
        </button>
        <button type="button" id="btn-grab" class="pad-btn btn-grab" title="Grab nearby load (Space)">
          Grab<span class="key">Space</span>
        </button>
        <div class="pad-label">Hold move · Space grab · camera free</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
