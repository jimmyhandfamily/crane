<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crane — Training Yard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #a8d4e8;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #hud .panel {
        pointer-events: auto;
      }
      #hud-title {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(8px);
        border-radius: 10px;
        padding: 12px 18px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      #hud-title h1 {
        font-size: 1.05rem;
        font-weight: 650;
        color: #2c3a45;
        letter-spacing: 0.01em;
      }
      #hud-title .role {
        font-size: 0.75rem;
        color: #5a6a75;
        margin-top: 2px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #hud-objective {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        padding: 14px 22px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.7);
        max-width: min(520px, 92vw);
        text-align: center;
      }
      #hud-objective .label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #7ba05b;
        font-weight: 600;
        margin-bottom: 4px;
      }
      #hud-objective .text {
        font-size: 0.95rem;
        color: #2c3a45;
        line-height: 1.35;
      }
      #hud-pay {
        position: absolute;
        top: 16px;
        right: 16px;
        background: rgba(232, 184, 74, 0.92);
        border-radius: 10px;
        padding: 10px 14px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        font-size: 0.8rem;
        color: #3a3018;
        font-weight: 600;
        opacity: 0.85;
      }
      #hud-pay .stub {
        font-size: 0.65rem;
        font-weight: 500;
        opacity: 0.75;
        margin-top: 2px;
      }
      #hud-hint {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.75rem;
        color: rgba(44, 58, 69, 0.55);
        background: rgba(255, 255, 255, 0.55);
        padding: 6px 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud">
      <div id="hud-title" class="panel">
        <h1>Training Yard</h1>
        <div class="role">Apprentice</div>
      </div>
      <div id="hud-pay" class="panel">
        Day rate: $0
        <div class="stub">Pay unlocks later — stub</div>
      </div>
      <div id="hud-objective" class="panel">
        <div class="label">Objective</div>
        <div class="text">Look around the yard. Get a feel for the crane.</div>
      </div>
      <div id="hud-hint">Drag to orbit · Scroll to zoom</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
